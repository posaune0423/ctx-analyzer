[package]
name = "ctx-analyzer"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Local-first context analyzer for coding agents (Codex MVP)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "ctx-analyzer"
path = "src/main.rs"

[lib]
name = "ctx_analyzer"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
glob = "0.3"
ratatui = "0.29"
crossterm = "0.28"
toml = { version = "0.8", default-features = false, features = ["parse"] }
unicode-width = "0.2.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

# Tests are organised under tests/{unit,integration}/<layer>/ per
# docs/STRUCTURE.md. Cargo only auto-discovers loose tests/*.rs files,
# so each nested test file is wired in explicitly here.

